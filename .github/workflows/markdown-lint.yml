name: Validate Markdown

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/markdown.links.config.json'
      - '.github/workflows/markdown-lint.yml'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
  schedule:
    # Run at 00:00 UTC on the first day of every month.
    - cron: '0 0 1 * *'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/markdown.links.config.json'
      - '.github/workflows/markdown-lint.yml'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: markdown-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned markdown tooling
        run: |
          npm ci
      # The log is kept so pr-guidance.yml can translate the errors whose
      # messages point at the wrong thing.
      #
      # `shell: bash` is load-bearing, not decoration. A step with no shell
      # specified runs under `bash -e {0}`, which does NOT set pipefail, so
      # `npm run validate | tee` reports tee's exit status and the quality
      # gate can never fail. Naming bash explicitly gets
      # `bash --noprofile --norc -eo pipefail {0}`, which is what makes the
      # pipeline report npm's status.
      - name: Run markdown quality checks
        shell: bash
        run: |
          mkdir -p .pr-guidance
          npm run validate 2>&1 | tee .pr-guidance/validate.log

      # The pull request's own README.md travels with the log. pr-guidance.yml
      # runs on workflow_run against the base branch and cannot see the head
      # commit, and telling a marker/casing error apart from a genuinely
      # missing dash means reading the line the linter pointed at.
      - name: Collect pull request context
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          mkdir -p .pr-guidance
          echo "$PR_NUMBER" > .pr-guidance/pr-number.txt
          cp README.md .pr-guidance/README.md

      - name: Upload pull request context
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-guidance
          path: .pr-guidance/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  markdown-link-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned markdown tooling
        run: npm ci
      - name: Check links
        run: npm run lint:links

      # Uploaded whatever the outcome. A failed run is exactly the one worth
      # keeping, and the recovered-on-retry case only exists in a run that
      # passed — the summary is useless if it survives only one of the two.
      # Unzip several of these into one directory and run
      # `node scripts/link-flake.js aggregate <dir>` to find the hosts that
      # deserve an ignorePatterns entry, instead of recalling them.
      - name: Upload link flake summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-check-report
          path: .link-check/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
