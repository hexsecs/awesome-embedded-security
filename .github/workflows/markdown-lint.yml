name: Validate Markdown

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/markdown.links.config.json'
      - '.github/workflows/markdown-lint.yml'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
  schedule:
    # Run at 00:00 UTC on the first day of every month.
    - cron: '0 0 1 * *'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/markdown.links.config.json'
      - '.github/workflows/markdown-lint.yml'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: markdown-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned markdown tooling
        run: |
          npm ci
      - name: Run markdown quality checks
        run: npm run validate

  markdown-link-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned markdown tooling
        run: npm ci
      - name: Check links
        run: npm run lint:links
